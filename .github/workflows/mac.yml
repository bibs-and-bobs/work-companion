# Builds the Mac app (.dmg + .zip, Apple Silicon and Intel) on a GitHub macOS runner.
# - Every run: the files are attached to the run as "Work-Companion-mac" (Actions tab → run → Artifacts).
# - Pushing a tag like v0.4.0: the files are also published as a GitHub Release.
# The app is ad-hoc signed (no paid Apple Developer ID); see README "Mac app" for the first-open step.
name: Build Mac app
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'build/**'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the signature
        run: |
          for app in dist/mac*/*.app; do codesign --verify --deep --strict --verbose=2 "$app"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Companion-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "Work Companion $GITHUB_REF_NAME" --generate-notes
